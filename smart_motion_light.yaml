blueprint:
  name: Smart Motion Light
  source_url: https://raw.githubusercontent.com/truidix/ha_blueprints/main/smart_motion_light.yaml
  description: >
    Turns a light on when motion is detected or a door opens.
    Optionally requires lux to be below a threshold — a closed roller shutter
    overrides the lux check. Door closes → light off immediately.
    Motion clears → light off after a configurable delay.
    Optionally also turns off a light that was switched on (e.g. manually)
    when no motion is detected for the turn-off delay.
    Optional extra motion sensors turn the light on whenever one of them
    detects new motion, even while the main sensor/group is still "on".
    Optional "sensors that may get stuck" are ignored for switching off once
    they have reported motion for a configurable time without any change.
    All condition inputs (lux, door, cover, toggle) are optional.
  domain: automation
  input:
    motion_trigger:
      name: Presence / Motion Sensor
      description: Binary sensor that detects presence or motion.
      selector:
        entity:
          domain: binary_sensor

    light_switch:
      name: Light or Switch
      description: The light or switch to control.
      selector:
        entity:
          domain:
            - light
            - switch

    time_delay:
      name: Turn-off delay (seconds)
      description: How long after motion clears before the light turns off.
      default: 120
      selector:
        number:
          min: 5
          max: 3600
          step: 5
          unit_of_measurement: s
          mode: slider

    ambient_light_sensor:
      name: Illuminance Sensor (optional)
      description: >
        If set, the light only turns on when lux is below the threshold
        (unless the roller shutter overrides it). Leave empty to ignore lux.
      default:
      selector:
        entity:
          domain: sensor
          device_class: illuminance

    ambient_light_value:
      name: Illuminance Threshold (lux)
      description: Light turns on only when lux is below this value.
      default: 68
      selector:
        number:
          min: 1
          max: 2000
          step: 1
          unit_of_measurement: lx
          mode: box

    contact_sensor:
      name: Door / Contact Sensor (optional)
      description: >
        Door opens → light on immediately.
        Door closes → light off immediately (motion state is ignored).
        Leave empty to use motion only.
      default: []
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - door
            - window
            - opening
          multiple: true

    cover_entity:
      name: Roller Shutter (optional)
      description: >
        When this cover is closed the light turns on regardless of illuminance.
        Leave empty to disable.
      default:
      selector:
        entity:
          domain: cover

    enable_toggle:
      name: Enable / Disable Toggle (optional)
      description: >
        Input boolean to enable or disable the automation.
        Leave empty to always run.
      default:
      selector:
        entity:
          domain: input_boolean

    extra_motion_sensors:
      name: Extra motion sensors for switching on (optional)
      description: >
        Each new motion on one of these sensors switches the light on (same
        lux/cover/toggle conditions), even while the main motion sensor is
        already "on" — e.g. the individual members of a sensor group, so a
        sensor stuck on "occupied" cannot block switching on again after the
        light was turned off manually. Switching off still follows the main
        motion sensor only, so these sensors should be part of it (group).
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    stuck_sensors:
      name: Sensors that may get stuck (optional)
      description: >
        Sensors listed here are ignored for switching off once they have shown
        motion for the stuck timeout without any change (e.g. a battery sensor
        that dropped off the network while showing "occupied"). They still
        switch the light on. The light then goes off when all other sensors
        (main sensor/group members and extra motion sensors) have reported no
        motion for the turn-off delay. Only list sensors whose "on" does not
        legitimately last that long — never mmWave presence sensors. Leave
        empty to keep the normal behaviour.
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    stuck_timeout:
      name: Stuck timeout (minutes)
      description: >
        After how many minutes of unchanged "motion" a sensor from the list
        above counts as stuck.
      default: 15
      selector:
        number:
          min: 1
          max: 240
          step: 1
          unit_of_measurement: min
          mode: box

    manual_off:
      name: Turn off manually switched-on light (optional)
      description: >
        If enabled, the light is also turned off when it has been on for the
        turn-off delay and the motion sensor has reported no motion for that
        long — e.g. after it was switched on manually and nobody walked by.
      default: false
      selector:
        boolean: {}

variables:
  ambient_light_sensor: !input ambient_light_sensor
  ambient_light_value: !input ambient_light_value
  cover_entity: !input cover_entity
  enable_toggle: !input enable_toggle
  time_delay: !input time_delay
  manual_off: !input manual_off
  motion_entity: !input motion_trigger
  extra_sensors: !input extra_motion_sensors
  stuck_sensors: !input stuck_sensors
  stuck_timeout: !input stuck_timeout

triggers:
  - trigger: state
    entity_id: !input motion_trigger
    to: "on"
    id: motion_on
  - trigger: state
    entity_id: !input extra_motion_sensors
    to: "on"
    id: motion_on
  - trigger: state
    entity_id: !input motion_trigger
    to: "off"
    id: motion_off
  # Only used when stuck_sensors is set (see conditions): an extra sensor
  # clearing, or a listed sensor sitting on "on" for the stuck timeout.
  - trigger: state
    entity_id: !input extra_motion_sensors
    to: "off"
    id: member_off
  - trigger: state
    entity_id: !input stuck_sensors
    to: "on"
    for:
      minutes: !input stuck_timeout
    id: sensor_stuck
  - trigger: state
    entity_id: !input contact_sensor
    to: "on"
    id: door_open
  - trigger: state
    entity_id: !input contact_sensor
    to: "off"
    id: door_close
  - trigger: state
    entity_id: !input light_switch
    to: "on"
    for:
      seconds: !input time_delay
    id: light_on_idle

# light_on_idle only starts a run when it will actually switch off, so it
# never restarts (and cancels) a running motion_off delay.
# member_off / sensor_stuck only start a run when stuck_sensors is set, so
# without it the blueprint behaves exactly as before.
conditions:
  - condition: or
    conditions:
      - condition: not
        conditions:
          - condition: trigger
            id:
              - member_off
              - sensor_stuck
      - "{{ stuck_sensors | count > 0 }}"
  - condition: or
    conditions:
      - condition: not
        conditions:
          - condition: trigger
            id: light_on_idle
      - condition: and
        conditions:
          - "{{ manual_off }}"
          - condition: state
            entity_id: !input motion_trigger
            state: "off"
            for:
              seconds: !input time_delay

actions:
  - choose:

      # ── Turn ON (motion or door open) ─────────────────────────────────────────
      - conditions:
          - condition: trigger
            id:
              - motion_on
              - door_open
          - condition: template
            value_template: >
              {{ enable_toggle in ('', none) or is_state(enable_toggle, 'on') }}
          - condition: template
            value_template: >
              {{
                ambient_light_sensor in ('', none)
                or states(ambient_light_sensor) | float(ambient_light_value + 1) < ambient_light_value
                or (cover_entity not in ('', none) and is_state(cover_entity, 'closed'))
              }}
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: !input light_switch

      # ── Door closes → off immediately ────────────────────────────────────────
      - conditions:
          - condition: trigger
            id: door_close
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: !input light_switch

      # ── Motion clears → off after delay ──────────────────────────────────────
      # Without stuck_sensors: off when the main sensor is still "off".
      # With stuck_sensors: off when no sensor shows motion, ignoring listed
      # sensors whose "on" is older than the stuck timeout.
      - conditions:
          - condition: trigger
            id:
              - motion_off
              - member_off
              - sensor_stuck
          - condition: state
            entity_id: !input light_switch
            state: "on"
        sequence:
          - delay:
              seconds: "{{ time_delay | int }}"
          - condition: template
            value_template: >
              {% if stuck_sensors | count == 0 %}
                {{ is_state(motion_entity, 'off') }}
              {% else %}
                {% set members = (expand(motion_entity) | map(attribute='entity_id') | list
                                  + (extra_sensors | list)) | unique | list %}
                {% set limit = now() - timedelta(minutes=stuck_timeout | int) %}
                {% set on = expand(members) | selectattr('state', 'eq', 'on') | list %}
                {% set real = on | rejectattr('entity_id', 'in', stuck_sensors) | list
                   + on | selectattr('entity_id', 'in', stuck_sensors)
                        | selectattr('last_changed', '>', limit) | list %}
                {{ real | count == 0 }}
              {% endif %}
          - action: homeassistant.turn_off
            target:
              entity_id: !input light_switch

      # ── Light on without motion (manual_off) → off ───────────────────────────
      - conditions:
          - condition: trigger
            id: light_on_idle
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: !input light_switch

mode: restart
