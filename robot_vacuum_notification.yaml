blueprint:
  name: Robot Vacuum Notification
  description: >
    Watches both the robot error sensor and the dock error sensor.
    Skips "unavailable" transitions (e.g. after HA restart) and "none" states
    on the robot sensor. Sends a mobile notification, a persistent notification,
    and optionally a TTS announcement via the ESPHome speaker.
  domain: automation
  input:
    robot_error_sensor:
      name: Roboter-Fehlersensor
      description: Sensor that reports the robot's error state.
      selector:
        entity:
          domain: sensor

    robot_message_prefix:
      name: Roboter-Nachricht
      description: >
        Beginning of the notification message for robot errors.
        The sensor state is appended automatically.
        Example: "Der obere Staubsauger hat folgenden Fehler gemeldet"
      selector:
        text: {}

    dock_error_sensor:
      name: Dockingstation-Fehlersensor
      description: Sensor that reports the dock's error state.
      selector:
        entity:
          domain: sensor

    dock_message_prefix:
      name: Dockingstation-Nachricht
      description: >
        Beginning of the notification message for dock errors.
        Example: "Die Dockingstation des oberen Staubsaugers hat folgendes gemeldet"
      selector:
        text: {}

    tts_toggle:
      name: TTS-Freigabe (optional)
      description: >
        Input boolean that enables TTS announcements.
        Leave empty to always speak.
      default: input_boolean.banchrtichtigungen_aktiv
      selector:
        entity:
          domain: input_boolean

variables:
  robot_error_sensor: !input robot_error_sensor
  robot_message_prefix: !input robot_message_prefix
  dock_error_sensor: !input dock_error_sensor
  dock_message_prefix: !input dock_message_prefix
  tts_toggle: !input tts_toggle
  triggered_sensor: >
    {{ robot_error_sensor if trigger.id == 'robot' else dock_error_sensor }}
  full_message: >
    {% set prefix = robot_message_prefix if trigger.id == 'robot' else dock_message_prefix %}
    {{ prefix }}: {{ state_translated(triggered_sensor) }}

triggers:
  - trigger: state
    entity_id: !input robot_error_sensor
    id: robot
  - trigger: state
    entity_id: !input dock_error_sensor
    id: dock

conditions:
  - condition: template
    value_template: >
      {{ not (trigger.id == 'robot' and is_state(robot_error_sensor, 'none'))
         and not is_state(triggered_sensor, 'unavailable')
         and trigger.from_state.state != 'unavailable' }}

actions:
  - action: notify.household_mobile_phones
    data:
      message: "{{ full_message }}"

  - action: persistent_notification.create
    data:
      message: "{{ full_message }}"

  - if:
      - condition: template
        value_template: >
          {{ tts_toggle in ('', none) or is_state(tts_toggle, 'on') }}
    then:
      - action: script.tts_announce_with_resume
        data:
          message: "{{ full_message }}"
          language: de
          device_type: cast

mode: single
